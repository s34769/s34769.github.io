<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Phornchanok Silanil</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#fffaff,#f1e5ff,#eadcff);
    color:#554466;
}

/* HEADER */
header{
    background:white;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 20px #9e78bd22;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    color:#8053aa;
    font-size:20px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:#77667f;
    font-size:14px;
    transition:.3s;
}

nav a:hover{
    color:#9b6cc0;
}

/* MAIN */
main{
    max-width:900px;
    margin:auto;
    padding:70px 20px;
    text-align:center;
}

h1{
    font-size:45px;
    color:#8053aa;
    margin-bottom:10px;
}

.subtitle{
    color:#9a89a3;
    margin-bottom:40px;
}

/* CONTACT CARDS */
.contact-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.contact-card{
    background:white;
    padding:35px 25px;
    border-radius:25px;
    box-shadow:0 10px 30px #9e78bd22;
    transition:.3s;
}

.contact-card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px #9e78bd35;
}

.icon{
    font-size:45px;
    margin-bottom:15px;
}

.contact-card h2{
    color:#8053aa;
    font-size:22px;
    margin-bottom:10px;
}

.contact-card p{
    color:#77667f;
    margin-bottom:18px;
}

.contact-card a{
    display:inline-block;
    text-decoration:none;
    background:#a77acb;
    color:white;
    padding:10px 22px;
    border-radius:25px;
    transition:.3s;
}

.contact-card a:hover{
    background:#875db2;
    transform:translateY(-3px);
}

/* DECORATION */
.float{
    position:fixed;
    pointer-events:none;
    animation:float 4s ease-in-out infinite;
}

.f1{
    top:20%;
    left:8%;
    font-size:30px;
}

.f2{
    top:30%;
    right:8%;
    font-size:25px;
    animation-delay:1s;
}

.f3{
    bottom:15%;
    left:12%;
    font-size:25px;
    animation-delay:2s;
}

.f4{
    bottom:20%;
    right:12%;
    font-size:30px;
    animation-delay:1.5s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }
    50%{
        transform:translateY(-15px) rotate(8deg);
    }
}

@media(max-width:600px){
    header{
        flex-direction:column;
        gap:15px;
    }

    nav{
        gap:12px;
        flex-wrap:wrap;
        justify-content:center;
    }

    h1{
        font-size:36px;
    }

    .contact-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Pan ♡
    </div>

        <a href="activities.html">กิจกรรม</a>
        <a href="contact.html">ติดต่อ</a>
    </nav>
</header>

<div class="float f1">✦</div>
<div class="float f2">♡</div>
<div class="float f3">🦋</div>
<div class="float f4">✧</div>

<main>

    <h1>Contact Me ♡</h1>

    <p class="subtitle">
        ช่องทางสำหรับติดต่อและติดตามผลงานของฉัน ✨
    </p>

    <div class="contact-grid">

        <div class="contact-card">
            <div class="icon">📧</div>

            <h2>Email</h2>

            <p>
                s34769@banbung.ac.th
            </p>

            <a href="mailto:s34769@banbung.ac.th">
                ส่งอีเมล 💌
            </a>
        </div>


        <div class="contact-card">
            <div class="icon">📸</div>

            <a href="https://www.instagram.com/p1zer_/" target="_blank">
                Instagram ✨
            </a>
        </div>

    </div>

</main>

</body>
</html>
