<style>
*{box-sizing:border-box;margin:0;padding:0}
body{

background:linear-gradient(135deg,#fffaff,#f1e5ff);

}
header{
background:white;padding:20px 7%;
display:flex;justify-content:space-between;align-items:center;

.logo{font-size:25px;font-weight:bold;color:#9165bd}
nav a{text-decoration:none;color:#665572;padding:10px 15px;border-radius:25px;display:inline-block}
nav a:hover,nav .active{background:#eadcff;color:#8053aa}
.page{max-width:1000px;margin:auto;padding:65px 25px}
.title{text-align:center;color:#9368bd;font-size:42px;margin-bottom:45px}
.edu{

.edu:hover{transform:translateX(8px)}
.icon{

background:#f0e2fb;display:flex;align-items:center;
justify-content:center;font-size:35px;flex-shrink:0
}
.num{font-size:25px;color:#b08bcf;font-weight:bold}
.edu h2{color:#75518e;margin:7px 0 10px}
.edu p{color:#796b83;line-height:1.7}
.level{color:#a074c7!important;font-size:14px}
footer{text-align:center;padding:25px;color:#a28cad}
.f{position:fixed;font-size:30px;opacity:.4;animation:float 4s infinite}
.f1{left:5%;top:25%}.f2{right:7%;top:20%}
.f3{left:10%;bottom:15%}.f4{right:8%;bottom:20%}
@keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}
@media(max-width:700px){
header{flex-direction:column;gap:12px}
nav{display:flex;flex-wrap:wrap;justify-content:center}
.edu{align-items:flex-start}
}
</style>
